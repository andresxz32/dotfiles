# Global default tool versions. Managed by chezmoi — edit via `chezmoi edit ~/.config/mise/config.toml`.
# Per-project overrides go in a project-local `.mise.toml` (or legacy `.nvmrc`/`.python-version`,
# which mise reads natively via idiomatic_version_file below).

[tools]
node    = "24.20.0"
python  = "3.12.14"
rust    = "1.98.1"
go      = "1.27.1"

[settings]
idiomatic_version_file = true   # respect .nvmrc / .python-version / .ruby-version in projects
experimental = true             # needed for some newer backends (npm:, cargo:, etc.)
