"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory\
$git_branch\
$git_status\
$fill\
$nodejs\
$python\
$rust\
$docker_context\
$cmd_duration
$character"""

add_newline = true

[fill]
symbol = " "

[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"
vimcmd_symbol  = "[❮](bold green)"

[directory]
truncation_length = 4
truncate_to_repo  = true
style = "bold cyan"

[git_branch]
symbol = " "
style  = "bold purple"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold yellow"
format = "([$all_status$ahead_behind]($style)) "
conflicted = "​⚔️"
ahead      = "⇡${count}"
behind     = "⇣${count}"
diverged   = "⇕⇡${ahead_count}⇣${behind_count}"
untracked  = "?${count}"
stashed    = "$${count}"
modified   = "!${count}"
staged     = "+${count}"
renamed    = "»${count}"
deleted    = "✘${count}"

[nodejs]
symbol = " "
format = "[$symbol$version]($style) "
style  = "bold green"

[python]
symbol = " "
format = "[$symbol$version]($style) "
style  = "bold yellow"

[rust]
symbol = " "
format = "[$symbol$version]($style) "
style  = "bold red"

[docker_context]
symbol = " "
format = "[$symbol$context]($style) "
style  = "bold blue"
only_with_files = true

[cmd_duration]
min_time = 2000
format   = "took [$duration]($style) "
style    = "bold yellow"

[package]
disabled = true
